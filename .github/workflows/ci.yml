name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Generate karaoke MP4 fixture
        run: |
          mkdir -p tests/fixtures
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=640x360:r=30:d=60 \
            -f lavfi -i sine=frequency=440:sample_rate=16000:duration=60 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            tests/fixtures/karaoke-fixture.mp4
      - name: Run karaoke browser smoke test
        run: |
          npm run dev > /tmp/movicut-dev.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/movicut-dev.log
            exit 1
          fi
          node tests/karaoke.e2e.mjs
      - run: npm run build
